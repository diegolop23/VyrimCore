name: VyrimCore
version: '${version}'

main: net.vyrim.core.VyrimCore
api-version: '1.21.11'

softdepend: [LuckPerms, PlaceholderAPI, MMOItems, MythicLib]

commands:
  prefix:
    description: Player-facing prefix builder controls
  prefixadmin:
    description: Staff command to set another player's prefix pieces
  vyrimcore:
    description: Core administrative management command
    permission: vyrimcore.command.reload
    usage: /<command> reload [module]
